<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#d9d2bd;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ui{transition:opacity .7s}
body.idle .ui{opacity:0;pointer-events:none}
#gear{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(22,34,24,.5);color:#fff;font-size:22px;line-height:44px;padding:0;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#status{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);color:#fff;font-size:13px;line-height:1.5;padding:4px 10px;border-radius:10px;background:rgba(22,34,24,.42);pointer-events:none;max-width:calc(100vw - 120px)}

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<div id="status" class="ui"></div>

<div id="panel" class="ui">
  <h2>いのちめぐる苔庭</h2>
  <div class="row"><div class="lbl">速さ</div><div class="seg" data-k="speed"><button data-v="0">もっとゆっくり</button><button data-v="1">ゆっくり</button><button data-v="2">ふつう</button><button data-v="3">はやい</button><button data-v="4">もっとはやく</button></div></div>
  <div class="row"><div class="lbl">季節</div><div class="seg" data-k="theme"><button data-v="auto">おまかせ</button><button data-v="haru">春</button><button data-v="natsu">夏</button><button data-v="aki">秋</button><button data-v="fuyu">冬</button></div></div>
  <div class="row"><div class="lbl">時間帯</div><div class="seg" data-k="time"><button data-v="auto">おまかせ</button><button data-v="朝">朝</button><button data-v="昼">昼</button><button data-v="夕">夕</button><button data-v="夜">夜</button></div></div>

  <div class="row"><div class="lbl">状況の表示</div><div class="seg" data-k="info"><button data-v="on">表示</button><button data-v="off">隠す</button></div></div>
  <div class="btns"><button class="btn" id="nextBtn">あたらしい種まき</button><button class="btn" id="fsBtn">全画面</button></div>
  <div class="note">画面をタップすると、その場所に種をまけます。苔は長く生きると花を咲かせます。庭がしずかになると、風が吹いて新しい種がまかれます。</div>
</div>
<script>
'use strict';
(function(){
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search);
const PI=Math.PI,TAU=PI*2;
let W=0,H=0,DPR=1;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Q.get('rng')?mulberry(+Q.get('rng')):Math.random;
const R=(a,b)=>a+(b-a)*rnd();
const RI=(a,b)=>Math.floor(a+(b-a+1)*rnd());
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU)}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,TAU)}

/* ---------------- themes ---------------- */
const THEMES=[
{id:'haru',name:'春の苔庭',short:'春',ground:['#eee6d2','#ddd3bb'],rake:'rgba(120,96,64,.17)',moss:['#4e8a35','#6eaa46','#a2d266'],young:['#7fbf55','#a6dc70','#dcf5a8'],
 fl:'sakura',pal:['#ffb3cc','#ffc8da','#fff3f6','#ff98ba'],amb:'petal',ambCol:['#ffc2d5','#ffd8e4','#ffadc6'],stone:'#a19c90',glow:'255,226,160',spTxt:'さくらの花びらが種になりました'},
{id:'natsu',name:'夏の苔庭',short:'夏',ground:['#e6e1ce','#d4ccb3'],rake:'rgba(90,90,60,.17)',moss:['#2e7a3c','#3f9a4a','#72c364'],young:['#5fb55a','#8fd47a','#d2f2a8'],
 fl:'ajisai',pal:['#7f9cf0','#9f8af0','#6fc2f0','#c3b5ff'],amb:'fluff',ambCol:['#ffffff'],stone:'#918f86',glow:'205,255,120',spTxt:'たんぽぽの綿毛が種になりました'},
{id:'aki',name:'秋の苔庭',short:'秋',ground:['#ecdcbf','#dbc8a3'],rake:'rgba(120,80,40,.18)',moss:['#5b7d30','#7e9a3a','#b9b24c'],young:['#8fa94a','#b5c05a','#ecdf94'],
 fl:'momiji',pal:['#e4432b','#ef7a27','#f2ae2e','#c72f29'],amb:'leaf',ambCol:['#e4432b','#ef8a2b','#e8b030'],stone:'#9b9081',glow:'255,196,120',spTxt:'もみじの葉が種になりました'},
{id:'fuyu',name:'冬の苔庭',short:'冬',ground:['#f4f7fb','#e2e8f1'],rake:'rgba(90,110,150,.13)',moss:['#3d6d49','#558a5b','#80ae80'],young:['#6c9f70','#8fbf90','#d6eed6'],
 fl:'tsubaki',pal:['#d52838','#ee4656','#f7f2f2'],amb:'snow',ambCol:['#ffffff'],stone:'#8e939c',snow:true,glow:'200,225,255',spTxt:'雪のひとひらが種になりました'}
];
const TIMES={'朝':{tint:[255,241,228],nf:0,mist:.18},'昼':{tint:[255,255,255],nf:0,mist:0},'夕':{tint:[255,233,212],nf:.35,mist:0},'夜':{tint:[150,162,214],nf:1,mist:0}};
const TIME_ORDER=['朝','昼','夕','夜'];
const SPEEDS=[1.2,2,3.2,5,8];
const TURBO=+Q.get('turbo')||1;
const SET=Object.assign({speed:'2',theme:'auto',time:'auto',sound:'off',info:'on'},(()=>{try{return JSON.parse(localStorage.getItem('lifegame-settings')||'{}')}catch(e){return{}}})());
SET.sound='off'; // always start silent
function saveSet(){try{localStorage.setItem('lifegame-settings',JSON.stringify(SET))}catch(e){}}
const gps=()=>(SPEEDS[+SET.speed]||3.2)*TURBO;

/* ---------------- patterns ---------------- */
const PAT={
 r:['.OO','OO.','.O.'],
 acorn:['.O.....','...O...','OO..OOO'],
 diehard:['......O.','OO......','.O...OOO'],
 rabbits:['O...OOO','OOO..O.','.O.....'],
 glider:['.O.','..O','OOO'],
 lwss:['.O..O','O....','O...O','OOOO.'],
 pulsar:['..OOO...OOO..','.............','O....O.O....O','O....O.O....O','O....O.O....O','..OOO...OOO..','.............','..OOO...OOO..','O....O.O....O','O....O.O....O','O....O.O....O','.............','..OOO...OOO..'],
 penta:['..O....O..','OO.OOOO.OO','..O....O..'],
 galaxy:['OOOOOO.OO','OOOOOO.OO','.......OO','OO.....OO','OO.....OO','OO.....OO','OO.......','OO.OOOOOO','OO.OOOOOO'],
 beacon:['OO..','OO..','..OO','..OO'],toad:['.OOO','OOO.'],blinker:['OOO'],
 pi:['OOO','O.O','O.O'],bhep:['O.OO','OOO.','.O..'],
 gun:['........................O...........','......................O.O...........','............OO......OO............OO','...........O...O....OO............OO','OO........O.....O...OO..............','OO........O...O.OO....O.O...........','..........O.....O.......O...........','...........O...O....................','............OO......................']
};
function cellsOf(rows){const p=[];rows.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]==='O')p.push([x,y])});return p}
function transform(pts,rot,flip){let p=pts.map(([x,y])=>[flip?-x:x,y]);for(let k=0;k<(rot&3);k++)p=p.map(([x,y])=>[-y,x]);const mx=Math.min(...p.map(a=>a[0])),my=Math.min(...p.map(a=>a[1]));return p.map(([x,y])=>[x-mx,y-my])}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of p){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y}return{x:a,y:b,w:c-a+1,h:d-b+1}}
function place(L,pts,ox,oy){for(const[x,y]of pts)L.push([ox+x,oy+y])}
function centerOn(L,cx,cy){const b=bbox(L);const dx=Math.round(cx-b.x-b.w/2),dy=Math.round(cy-b.y-b.h/2);return L.map(([x,y])=>[x+dx,y+dy])}
function spots(n){const out=[];for(let k=0;k<n;k++){let best=null,bd=-1;for(let t=0;t<20;t++){const p=[R(.25,.75)*VC,R(.25,.75)*VR];let d=1e9;for(const q of out)d=Math.min(d,Math.hypot(p[0]-q[0],p[1]-q[1]));if(d>bd){bd=d;best=p}}out.push(best)}return out}
function multi(name,min,max){const L=[];const n=RI(min,max);for(const[cx,cy]of spots(n)){const p=transform(cellsOf(PAT[name]),RI(0,3),rnd()<.5);const b=bbox(p);place(L,p,Math.round(cx-b.w/2),Math.round(cy-b.h/2))}return L}
const SEEDS={
 soup:{name:'ばらまき',w:3,maxGen:700,make(){const L=[];const n=RI(3,5);for(let k=0;k<n;k++){const cx=R(.22,.78)*VC,cy=R(.22,.78)*VR,md=(VC+VR)/2,rx=R(.06,.12)*md+3,ry=R(.06,.12)*md+3;
   for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const d=((x-cx)/rx)**2+((y-cy)/ry)**2;if(d<1&&rnd()<.42*(1-d*.45))L.push([x,y])}}return L}},
 r:{name:'R-ペントミノ',w:2,maxGen:900,make:()=>multi('r',1,2)},
 acorn:{name:'どんぐり',w:2,maxGen:900,make:()=>multi('acorn',1,2)},
 rabbits:{name:'うさぎ',w:1,maxGen:900,make:()=>multi('rabbits',1,2)},
 diehard:{name:'ダイハード',w:1,maxGen:400,quiet:true,make:()=>multi('diehard',1,1)},
 gliders:{name:'グライダーの群れ',w:1.5,maxGen:500,make(){const L=[];for(const[cx,cy]of spots(RI(5,8))){const p=transform(cellsOf(PAT.glider),RI(0,3),rnd()<.5);place(L,p,Math.round(cx),Math.round(cy))}
   for(const[cx,cy]of spots(RI(2,3)))place(L,cellsOf(['OO','OO']),Math.round(cx),Math.round(cy));return L}},
 osc:{name:'振動子の花壇',w:1.5,maxGen:400,linger:26,quiet:true,make(){const items=['pulsar','penta','galaxy','beacon','toad','blinker','pulsar','galaxy','penta'];const its=[];let x=3,y=3,rowH=0;
   for(let t=0;t<40;t++){const k=pick(items);let pts=cellsOf(PAT[k]);if(k==='penta'&&(VR>VC||rnd()<.3))pts=transform(pts,1,false);const b=bbox(pts);const gap=k==='penta'?8:5;
     if(x+b.w>VC-3){x=3;y+=rowH;rowH=0}if(y+b.h>VR-3)break;if(x+b.w>VC-3)continue;its.push({pts,x,y,w:b.w,h:b.h});x+=b.w+gap;rowH=Math.max(rowH,b.h+gap)}
   let L=[];for(const it of its)place(L,it.pts,it.x,it.y);const b0=bbox(L.length?L:[[0,0]]);const dx=Math.round(VC/2-b0.x-b0.w/2),dy=Math.round(VR/2-b0.y-b0.h/2);
   const F=features();L=[];for(const it of its){const cx=cellX(it.x+dx+it.w/2),cy=cellY(it.y+dy+it.h/2),rad=Math.hypot(it.w,it.h)*cs/2;if(F.some(f=>Math.hypot(cx-f.x,cy-f.y)<rad+f.r+L_U()*.5))continue;place(L,it.pts,it.x+dx,it.y+dy)}
   return L}},
 gun:{name:'グライダー銃',w:1,maxGen:500,linger:24,quiet:true,make(){let p=cellsOf(PAT.gun);if(VC<42)p=transform(p,1,rnd()<.5);else if(rnd()<.5)p=transform(p,0,true);return centerOn(p,VC/2,VR*.4)}}
};
const SEED_IDS=Object.keys(SEEDS);

/* ---------------- audio ---------------- */
const AU={c:null,m:null,wg:null};
function auInit(){
  if(AU.c)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AU.c=new AC();AU.m=c.createGain();AU.m.gain.value=.55;AU.m.connect(c.destination);
  const len=c.sampleRate*3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.2}
  const src=c.createBufferSource();src.buffer=b;src.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.7;
  AU.wg=c.createGain();AU.wg.gain.value=0;src.connect(bp);bp.connect(AU.wg);AU.wg.connect(AU.m);src.start();
}
const sOn=()=>SET.sound==='on'&&AU.c;
function tone(f,v,dur,type,delay,f2){if(!sOn())return;const c=AU.c,t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.05)}
function noiseHit(v,dur,freq,q,delay,type){if(!sOn())return;const c=AU.c,t=c.currentTime+(delay||0);const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){const e=i/n;d[i]=(Math.random()*2-1)*(type==='swell'?Math.sin(e*PI):1-e)}const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.m);s.start(t)}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
const sfx={
 kakon(){tone(560,.16,.22,'triangle',0,500);noiseHit(.16,.06,1400,3);tone(830,.06,.15,'triangle',.01);tone(560,.04,.25,'triangle',.28,520)},
 sow(){const b=RI(0,3);for(let k=0;k<4;k++)tone(PENTA[b+k]||PENTA[7],.05,1.1,'sine',.15+k*.16)},
 pop(){tone(620,.06,.12,'sine',0,1040);tone(1240,.03,.2,'sine',.05)},
 chirp(){for(let k=0;k<2;k++)tone(3200,.035,.08,'sine',k*.13,4300)},
 meow(){if(!sOn())return;const c=AU.c,t=c.currentTime;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(480,t);o.frequency.linearRampToValueAtTime(760,t+.18);o.frequency.linearRampToValueAtTime(430,t+.55);f.type='bandpass';f.frequency.value=1300;f.Q.value=2.5;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(f);f.connect(g);g.connect(AU.m);o.start(t);o.stop(t+.65)},
 wind(){noiseHit(.12,2.2,500,.5,0,'swell')},
 seed(){tone(pick(PENTA)*2,.04,.6,'sine')}
};
function waterLevel(v){if(!AU.c)return;AU.wg.gain.setTargetAtTime(SET.sound==='on'?v:0,AU.c.currentTime,.6)}

/* ---------------- grid & simulation ---------------- */
const M=8;
let cs=16,VC=0,VR=0,GC=0,GR=0,offX=0,offY=0;
let A=new Uint8Array(0),B=new Uint8Array(0),AGE=new Uint16Array(0),VIS=new Float32Array(0),HS=new Uint32Array(0);
const L={U:100,safe:{t:0,r:0,b:0,l:0}};
const S={epoch:0,gen:0,pop:0,births:0,deaths:0,phase:'boot',pt:0,themeIdx:0,timeIdx:0,theme:THEMES[0],seedId:'soup',seed:SEEDS.soup,lastSeed:'',
 hist:new Map(),histQ:[],cycle:0,reason:'',calmResets:0,linger:10,genAcc:0,reseeds:0,log:[],parts:[],amb:[],seeds:[],visitors:[],
 sh:{fill:.4,tip:-1,ang:0,force:false,bounce:0,rip:[]},knocks:0,wob:0,msg:'',msgT:0,
 bird:null,birdT:R(14,26),cat:null,catT:R(22,40),spG:150,visG:200,
 taps:0,petalSeeds:0,birds:0,cats:0,eaten:0,visitorsN:0,tint:[255,255,255],nf:0,mist:0,fps:60,steps:0,introT:0};
const I=(x,y)=>(y+M)*GC+(x+M);
const cellX=x=>offX+(x+.5)*cs, cellY=y=>offY+(y+.5)*cs;
const curTime=()=>SET.time==='auto'?TIME_ORDER[S.timeIdx]:SET.time;

function readSafe(){const st=getComputedStyle($('#sa'));L.safe={t:parseFloat(st.paddingTop)||0,r:parseFloat(st.paddingRight)||0,b:parseFloat(st.paddingBottom)||0,l:parseFloat(st.paddingLeft)||0}}
function allocGrid(){
  const nc=clamp(Math.round(Math.sqrt(W*H/2600)),11,26);const nVC=Math.ceil(W/nc),nVR=Math.ceil(H/nc),nGC=nVC+2*M,nGR=nVR+2*M;
  const oA=A,oAGE=AGE,oVIS=VIS,oVC=VC,oVR=VR,oGC=GC;
  cs=nc;VC=nVC;VR=nVR;GC=nGC;GR=nGR;offX=(W-VC*cs)/2;offY=(H-VR*cs)/2;
  const N=GC*GR;A=new Uint8Array(N);B=new Uint8Array(N);AGE=new Uint16Array(N);VIS=new Float32Array(N);HS=new Uint32Array(N);
  for(let i=0;i<N;i++){let h=Math.imul(i+1,2654435761);h^=h>>>15;h=Math.imul(h,2246822519);h^=h>>>13;HS[i]=h>>>0}
  if(oGC){const dx=Math.floor((VC-oVC)/2),dy=Math.floor((VR-oVR)/2);
    for(let y=-M+1;y<oVR+M-1;y++)for(let x=-M+1;x<oVC+M-1;x++){const nx=x+dx,ny=y+dy;if(nx<=-M||ny<=-M||nx>=VC+M-1||ny>=VR+M-1)continue;const oi=(y+M)*oGC+(x+M),ni=I(nx,ny);A[ni]=oA[oi];AGE[ni]=oAGE[oi];VIS[ni]=oVIS[oi]}
    for(const v of S.visitors){v.x+=dx;v.y+=dy}
    S.hist.clear();S.histQ.length=0}
}

  if(S.phase==='sow'){let all=true;for(const s of S.seeds){if(s.done)continue;if(S.pt>=s.t0+s.dur){s.done=true;setCell(s.x,s.y);if(rnd()<.08)addP({k:'spark',x:cellX(s.x),y:cellY(s.y),vx:R(-1,1)*cs,vy:-cs*R(1,2),life:0,max:.6,r:cs*.22})}else all=false}
    if(all&&S.pt>2.6){countPop();S.phase='grow';S.pt=0}}
  else if(S.phase==='grow'||S.phase==='calm'){S.genAcc+=dt*gps();let n=0;while(S.genAcc>=1&&n<40){S.genAcc-=1;n++;afterStep(step());if(S.phase==='grow'&&!S.seed.quiet){if(--S.spG<=0){S.spG=RI(90,160);spawnPetal()}if(--S.visG<=0){S.visG=RI(160,280);spawnVisitor()}}}if(S.genAcc>1)S.genAcc=1;
    if(S.phase==='calm'&&S.pt>=S.linger)startWind();}
  else if(S.phase==='wind'){if(S.pt>=2.3)newEpoch(false)}
  // cell visuals
  const wind=S.phase==='wind',kv=1-Math.exp(-(wind?gdt*1.5:dt*clamp(gps()*1.6,2.5,40)));
  for(let i=0;i<VIS.length;i++){const tg=wind?0:A[i],v=VIS[i];if(v!==tg){const nv=v+(tg-v)*kv;VIS[i]=Math.abs(nv-tg)<.004?tg:nv}}
  // shishi-odoshi
  const g=S.sh;g.rip=g.rip.map(r=>r+gdt).filter(r=>r<1.6);g.bounce=Math.max(0,g.bounce-gdt*.8);
  if(g.tip<0){g.fill+=gdt*(g.force?1.6:1/18);g.ang=lerp(.42,.3,clamp(g.fill,0,1));if(g.fill>=1){g.tip=0;g.force=false}}
  else{g.tip+=gdt;const tp=g.tip;
    if(tp<.45)g.ang=lerp(.3,-.4,ease(tp/.45));else if(tp<.9){g.ang=-.4;if(rnd()<.6){const ex=L.sX-U*.55*Math.cos(g.ang),ey=L.sY-U*.12-U*.55*Math.sin(g.ang);addP({k:'drop',x:ex+R(-.02,.02)*U,y:ey,vx:R(-.15,.15)*U,vy:R(0,.3)*U,life:0,max:1.2,r:U*.014,floor:L.bY})}}
    else{const f=clamp((tp-.9)/.3,0,1);g.ang=lerp(-.4,.42,f*f);
      if(f>=1){g.tip=-1;g.fill=0;g.ang=.42;g.bounce=.25;S.knocks++;S.wob=1;g.rip.push(0);sfx.kakon();addP({k:'txt',txt:'カコーン',x:L.sX+U*.3,y:L.sY-U*.25,vx:0,vy:-U*.25,life:0,max:1.5,r:Math.max(13,U*.17)})}}}
  // particles
  for(const p of S.parts){p.life+=gdt;p.x+=p.vx*gdt;p.y+=p.vy*gdt;
    if(p.k==='drop'){p.vy+=U*5*gdt;if(p.y>=p.floor){p.life=p.max;if(rnd()<.3)g.rip.push(0)}}
    else if(p.k==='spark'||p.k==='crumb')p.vy+=cs*3*gdt;else if(p.k==='gust')p.rot+=p.vr*gdt}
  S.parts=S.parts.filter(p=>p.life<p.max);
  // ambient
  const t=performance.now()/1000;
  for(let j=0;j<S.amb.length;j++){const p=S.amb[j];
    if(p.k==='ff'){p.vx+=R(-30,30)*gdt;p.vy+=R(-30,30)*gdt;p.vx*=.98;p.vy*=.98;p.x+=p.vx*gdt;p.y+=p.vy*gdt;if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;continue}
    p.x+=(p.vx+Math.sin(t*.8+p.ph)*10)*gdt;p.y+=p.vy*gdt;p.rot+=p.vr*gdt;if(p.y>H+20||p.x>W+40||p.x<-W*.2)S.amb[j]=newAmb(th,false)}
  // special petal -> seed
    if(S.sp){const p=S.sp;p.t+=gdt;const f=clamp(p.t/p.dur,0,1);p.x=lerp(p.x0,p.tx,ease(f))+Math.sin(f*9)*cs*1.6*(1-f);p.y=lerp(p.y0,p.ty,f);p.rot=Math.sin(f*7)*1.2;
    if(f>=1){S.sp=null;if(S.phase==='grow'){const n=plantPattern(p.gx,p.gy,pick(['rand','rand','r','pi','bhep']));if(n){S.petalSeeds++;say(th.spTxt);sfx.seed();for(let k=0;k<10;k++){const a=k/10*TAU;addP({k:'spark',x:p.tx,y:p.ty,vx:Math.cos(a)*cs*2.6,vy:Math.sin(a)*cs*2.6-cs,life:0,max:.9,r:cs*.3})}}}}}
  // visitors
    // bird
  if(!S.bird){S.birdT-=gdt;if(S.birdT<=0){S.birdT=R(35,65);spawnBird()}}
  else{const b=S.bird;b.t+=gdt;
    if(b.st==='fly'){const f=clamp(b.t/1.8,0,1);b.x=lerp(b.x0,b.tx,ease(f));b.y=lerp(b.y0,b.ty,ease(f))-Math.sin(f*PI)*H*.08;if(f>=1){b.st='hop';b.t=0;sfx.chirp()}}
    else if(b.st==='hop'){const ph=(b.t%.5)/.5;b.peck=Math.max(0,Math.sin(ph*PI));const k=Math.floor(b.t/.5);if(k>b.pk){b.pk=k;for(let j=0;j<3;j++)addP({k:'crumb',x:cellX(b.gx),y:cellY(b.gy),vx:R(-1,1)*cs*1.5,vy:-cs*R(1,2.5),life:0,max:.6,r:Math.max(1.2,cs*.07)})}
      if(b.t>=1.5){let i=-1;for(let r=0;r<=1&&i<0;r++)for(let yy=b.gy-r;yy<=b.gy+r&&i<0;yy++)for(let xx=b.gx-r;xx<=b.gx+r;xx++){const j=I(xx,yy);if(A[j]){i=j;break}}if(i>=0){A[i]=0;S.eaten++;countPop();disturb()}b.peck=0;b.st='rest';b.t=0;sfx.chirp();addP({k:'txt',txt:'チュン',x:b.x,y:b.y-U*.3,vx:0,vy:-U*.2,life:0,max:1.2,r:Math.max(12,U*.13)})}}
    else if(b.st==='rest'){if(b.t>=.8){b.st='leave';b.t=0}}
    else{b.x+=b.dir*U*3*gdt;b.y-=U*2*gdt;if(b.x<-60||b.x>W+60||b.y<-60)S.bird=null}}
  // cat
  if(!S.cat){S.catT-=gdt;if(S.catT<=0){S.catT=R(55,95);spawnCat()}}
  else{const k=S.cat;k.t+=gdt;
    if(k.st==='walk'){k.x+=k.dir*U*.55*gdt;k.ph+=gdt*7;if(k.sitAt>0&&!k.sat&&(k.dir>0?k.x>=k.sitAt:k.x<=k.sitAt)){k.st='sit';k.t=0;k.sat=true;sfx.meow();addP({k:'txt',txt:'にゃ〜',x:k.x+k.dir*U*.1,y:k.y-U*.55,vx:0,vy:-U*.15,life:0,max:1.6,r:Math.max(12,U*.14)})}
      if(k.x<-U||k.x>W+U)S.cat=null}
    else if(k.t>4.5){k.st='walk';k.t=0}}
}

/* ---------------- layout ---------------- */
function layout(){const U=L.U=clamp(Math.min(W,H)*.2,80,170),s=L.safe;
  L.sX=s.l+U*1.2;L.sY=H-s.b-U*.5;L.bX=L.sX-U*.5;L.bY=L.sY+U*.2;L.lX=W-s.r-U*.5;L.lY=s.t+U*1.25}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);readSafe();layout();allocGrid();buildSprites();buildBg(bg);bgFade=0;if(S.amb.length)initAmb()}

/* ---------------- icon ---------------- */
function drawIcon(N){
  W=H=N;DPR=1;cv.width=cv.height=N;cv.style.width=cv.style.height=N+'px';cs=Math.round(N/5.4);S.theme=THEMES[0];S.themeIdx=0;buildSprites();const c=ctx;c.setTransform(1,0,0,1,0,0);
  const g=c.createLinearGradient(0,0,N,N);g.addColorStop(0,'#f2ead7');g.addColorStop(1,'#d9ceb2');c.fillStyle=g;c.fillRect(0,0,N,N);
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=N/90;for(let k=0;k<8;k++){c.beginPath();c.arc(N*.5,N*.5+N/200,N*(.1+k*.07),0,TAU);c.stroke()}
  c.strokeStyle='rgba(120,96,64,.22)';for(let k=0;k<8;k++){c.beginPath();c.arc(N*.5,N*.5,N*(.1+k*.07),0,TAU);c.stroke()}
  const pts=cellsOf(PAT.glider);for(const[x,y]of pts){const px=N/2+(x-1)*cs,py=N/2+(y-1)*cs,sz=cs*1.45;c.drawImage(SP.moss[(x*3+y)&3],px-sz/2,py-sz/2,sz,sz)}
  for(const[x,y,k]of[[1,0,0],[2,2,1],[0,2,3]]){const px=N/2+(x-1)*cs+cs*.12,py=N/2+(y-1)*cs-cs*.1,fs=cs*.95;c.drawImage(SP.fl[k],px-fs/2,py-fs/2,fs,fs)}
  for(const[px,py,r]of[[.16,.2,.035],[.82,.14,.03],[.86,.84,.035],[.14,.8,.028]])drawPetal(c,{k:'petal',x:px*N,y:py*N,rot:px*5},r*N,'#ffb6cc');
}

/* ---------------- UI ---------------- */
const panel=$('#panel'),status=$('#status');status.style.whiteSpace='pre-line';
function syncUI(){document.querySelectorAll('.seg').forEach(sg=>{const k=sg.dataset.k;sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(SET[k])))});status.classList.toggle('off',SET.info==='off')}
function setOpt(k,v){const old=SET[k];SET[k]=v;saveSet();syncUI();
  if(k==='sound'){if(v==='on'){auInit();if(AU.c&&AU.c.resume)AU.c.resume();waterLevel(.035)}else waterLevel(0)}
  if(k==='theme'&&v!==old)applyTheme();
  if(k==='time'&&v!==old&&v==='auto'&&old!=='auto')S.timeIdx=Math.max(0,TIME_ORDER.indexOf(old));
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setOpt(b.parentElement.dataset.k,b.dataset.v);poke()}));
$('#gear').addEventListener('click',e=>{e.stopPropagation();panel.classList.toggle('open');poke()});
$('#nextBtn').addEventListener('click',e=>{e.stopPropagation();if(S.phase==='grow'||S.phase==='calm')startWind('button');poke()});
const fsOK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!fsOK)$('#fsBtn').style.display='none';
$('#fsBtn').addEventListener('click',e=>{e.stopPropagation();const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{})}}catch(err){}});
let idleT=0;function poke(){idleT=0;document.body.classList.remove('idle')}
['pointermove','keydown'].forEach(ev=>addEventListener(ev,poke));
cv.addEventListener('pointerdown',e=>{poke();if(panel.classList.contains('open')){panel.classList.remove('open');return}plantAt(e.clientX,e.clientY)});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(AU.c){if(document.hidden)AU.c.suspend();else if(SET.sound==='on')AU.c.resume()}});

/* ---------------- boot ---------------- */
const PH_TXT={sow:'種をまいています',grow:'そだっています',wind:'風が吹いて、次の種まきへ'};
window.__lifegame={state:()=>({epoch:S.epoch,gen:S.gen,pop:S.pop,births:S.births,deaths:S.deaths,phase:S.phase,theme:S.theme.id,time:curTime(),seed:S.seedId,seedName:S.seed.name,reason:S.reason,kind:S.kind||'',cycle:S.cycle,
   reseeds:S.reseeds,cols:VC,rows:VR,cs,U:L.U,knocks:S.knocks,taps:S.taps,petalSeeds:S.petalSeeds,birds:S.birds,cats:S.cats,eaten:S.eaten,visitors:S.visitorsN,tracked:S.visitors.length,
   bird:S.bird?S.bird.st:null,cat:S.cat?S.cat.st:null,petal:!!S.sp,nf:S.nf,tint:S.tint.map(v=>Math.round(v)),fps:Math.round(S.fps),steps:S.steps,log:S.log.slice(-12)}),
 setOpt,reseed:()=>startWind('button'),plant:(x,y)=>plantAt(x,y),cellPoint:(x,y)=>({x:cellX(x),y:cellY(y)}),
 bird:spawnBird,cat:spawnCat,petal:spawnPetal,visitor:spawnVisitor,
 alive:()=>{const o=[];for(let y=0;y<VR;y++)for(let x=0;x<VC;x++)if(A[I(x,y)])o.push([x,y]);return o}};
const iconN=+Q.get('icon');
if(iconN){document.querySelectorAll('.ui').forEach(e=>e.remove());drawIcon(iconN);return}
for(const k of['theme','time','speed'])if(Q.get(k))SET[k]=Q.get(k);
S.themeIdx=SET.theme==='auto'?realSeason():Math.max(0,THEMES.findIndex(t=>t.id===SET.theme));S.theme=THEMES[S.themeIdx];S.timeIdx=realTime();
{const T=TIMES[curTime()]||TIMES['昼'];S.tint=T.tint.slice();S.nf=T.nf;S.mist=T.mist}
resize();initAmb();syncUI();S.introT=0;
newEpoch(true);
let last=performance.now()/1000;
function frame(ms){const now=ms/1000;const dt=Math.min(.05,Math.max(0,now-last));last=now;idleT+=dt;if(dt>0)S.fps=lerp(S.fps,1/dt,.05);
  if(idleT>3.5&&!panel.classList.contains('open'))document.body.classList.add('idle');
  update(dt);render(now);
  if(SET.info==='on'){const ph=S.msgT>0?S.msg:S.phase==='calm'?S.reason:(PH_TXT[S.phase]||'');status.textContent=`第${S.epoch}の庭　${S.theme.short}・${curTime()}　${S.seed.name}\n${S.gen}世代　いのち ${S.pop}　${ph}`}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
